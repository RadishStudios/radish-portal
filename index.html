<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>radish</title>
<style>
:root{
  --ink:#000; --pink:#000; --paper:#fff;
  --rule:rgba(0,0,0,.28); --rule-soft:rgba(0,0,0,.12);
  --dim:rgba(0,0,0,.5); --dimmer:rgba(0,0,0,.32);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink);}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:11px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:80px;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;padding:0;}
a{color:var(--pink);text-decoration:none;} a:hover{text-decoration:underline;}
::selection{background:#000;color:#fff;}
:focus-visible{outline:1px solid var(--pink);outline-offset:2px;}
.up{text-transform:uppercase;letter-spacing:.14em;}
.mono{font-variant-numeric:tabular-nums;}
.pink{color:var(--pink);} .dim{color:var(--dim);} .tiny{font-size:9px;}

header{position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:1px solid var(--ink);padding:14px 22px 0;}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.logo{font-size:12px;font-weight:500;}
.mast-right{display:flex;gap:16px;align-items:baseline;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.mast-right button{letter-spacing:.12em;text-transform:uppercase;font-size:9px;color:var(--dim);}
.mast-right button:hover{color:var(--pink);}
nav{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap;}
nav button{font-size:10px;padding-bottom:8px;border-bottom:2px solid transparent;color:var(--dim);}
nav button.on{color:var(--ink);border-bottom-color:var(--pink);}
nav button:hover{color:var(--ink);}

.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:9px 22px;border-bottom:.5px solid var(--rule-soft);font-size:10px;}
.bar input[type=search],.bar input[type=text],.bar select{border:none;border-bottom:.5px solid var(--rule);background:none;padding:3px 0;min-width:150px;}
.bar input::placeholder{color:var(--dimmer);}
.chip{font-size:9px;border:.5px solid var(--rule);padding:3px 8px;color:var(--dim);}
.chip.on{border-color:var(--pink);color:var(--pink);}
main{padding:26px 22px 60px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:1px;background:var(--rule-soft);border:.5px solid var(--rule-soft);}
.card{background:var(--paper);padding:14px 15px 16px;min-height:170px;display:flex;flex-direction:column;cursor:pointer;}
.card:hover{background:#fafafa;} .card:hover .card-title{color:var(--pink);}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:.5px solid var(--ink);padding-bottom:6px;margin-bottom:8px;}
.card-title{font-size:10px;font-weight:500;}
.card-count{font-size:9px;color:var(--dim);}
.card-kicker{font-size:9px;color:var(--dim);margin-bottom:7px;}
.card-list{flex:1;}
.card-line{display:flex;gap:6px;align-items:baseline;margin-bottom:2px;}
.card-line .dot{width:3px;height:3px;border-radius:50%;background:var(--ink);flex:none;transform:translateY(-2px);}
.card-line.done{color:#555;text-decoration:line-through;}
.card-line .who{color:var(--pink);font-size:9px;letter-spacing:.06em;text-transform:uppercase;flex:none;}
.card-foot{display:flex;justify-content:space-between;margin-top:10px;padding-top:7px;border-top:.5px solid var(--rule-soft);font-size:9px;color:var(--dimmer);}
.bar-mini{height:2px;background:var(--rule-soft);margin-top:8px;}
.bar-mini i{display:block;height:100%;background:var(--pink);}

.detail-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:9px;margin-bottom:16px;}
.detail-title{font-size:15px;font-weight:400;}
.back{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
.back:hover{color:var(--pink);}
.rows{border-top:.5px solid var(--rule-soft);max-width:1000px;}
.row{display:grid;grid-template-columns:16px 1fr 92px 78px 70px 20px;gap:10px;align-items:start;padding:7px 2px;border-bottom:.5px solid var(--rule-soft);}
.row:hover{background:#fafafa;}
.row .txt{border:none;background:none;width:100%;resize:none;overflow:hidden;line-height:1.45;padding:0;}
.row.done .txt{color:#555;text-decoration:line-through;}
.row select,.row input[type=date]{border:none;background:none;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);width:100%;}
.row input[type=date]{text-transform:none;letter-spacing:0;}
.row select.has{color:var(--pink);}
.check{width:11px;height:11px;border:.5px solid var(--ink);margin-top:3px;flex:none;}
.check.on{background:var(--pink);border-color:var(--pink);}
.check.flag{border-color:var(--pink);}
.kill{color:var(--dimmer);font-size:12px;line-height:1;} .kill:hover{color:var(--pink);}
.row-head{display:grid;grid-template-columns:16px 1fr 92px 78px 70px 20px;gap:10px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);padding:0 2px 5px;}
.add-row{display:flex;gap:10px;align-items:center;padding:9px 2px;max-width:1000px;}
.add-row input{border:none;border-bottom:.5px solid var(--rule);background:none;flex:1;padding:3px 0;}
.btn{font-size:9px;letter-spacing:.13em;text-transform:uppercase;border:.5px solid var(--ink);padding:5px 11px;}
.btn:hover{background:var(--ink);color:var(--paper);}
.btn.p{border-color:var(--pink);color:var(--pink);}
.btn.p:hover{background:var(--pink);color:#fff;}
.btn.sm{padding:3px 7px;}
.sec-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);margin:34px 0 12px;padding-bottom:0;border:none;max-width:1000px;}
.links{display:flex;flex-wrap:wrap;gap:8px;max-width:1000px;}
.link-pill{border:.5px solid var(--rule);padding:4px 9px;font-size:9px;display:flex;gap:7px;align-items:center;}
.link-pill a{color:var(--ink);} .link-pill a:hover{color:var(--pink);}

table{border-collapse:collapse;width:100%;max-width:1100px;}
th{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);text-align:left;font-weight:400;padding:0 10px 6px 0;border-bottom:.5px solid var(--ink);}
td{padding:8px 10px 8px 0;border-bottom:.5px solid var(--rule-soft);vertical-align:top;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:14px;}
tr:hover td{background:#fafafa;}
.stats{display:flex;gap:1px;background:var(--rule-soft);border:.5px solid var(--rule-soft);margin-bottom:22px;flex-wrap:wrap;}
.ig-col .stats{max-width:660px;}
.stat{background:var(--paper);padding:12px 16px;flex:1;min-width:130px;}

.stat b{display:block;font-size:17px;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:2px;}
.stat span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.stat.hot b{color:var(--pink);}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:1px;background:var(--rule-soft);border:.5px solid var(--rule-soft);}
.person{background:var(--paper);padding:14px 15px;}
.person h4{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;cursor:pointer;}
.person h4:hover{color:var(--pink);}
.person .role{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);margin-bottom:9px;}
.person dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:10px;margin-bottom:11px;}
.person dt{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);}
.person dd{font-variant-numeric:tabular-nums;text-align:right;}
.person .acts{display:flex;gap:7px;flex-wrap:wrap;}

.scrim{position:fixed;inset:0;background:rgba(255,255,255,.88);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px;overflow:auto;}
.modal{background:var(--paper);border:1px solid var(--ink);padding:22px 24px 24px;width:100%;max-width:430px;}
.modal h3{font-size:11px;font-weight:500;border-bottom:.5px solid var(--ink);padding-bottom:8px;margin-bottom:16px;}
.f{margin-bottom:13px;}
.f label{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.f input,.f select,.f textarea{width:100%;border:none;border-bottom:.5px solid var(--rule);background:none;padding:5px 0;}
.f textarea{resize:vertical;min-height:52px;border:.5px solid var(--rule);padding:7px;}
.modal-acts{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;}

.cal-day{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:11px 0;border-bottom:.5px solid var(--rule-soft);max-width:1000px;}
.cal-date{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);padding-top:1px;}
.cal-date.today{color:var(--pink);}
.cal-item{display:flex;gap:9px;align-items:baseline;margin-bottom:3px;}
.tag{font-size:8px;letter-spacing:.11em;text-transform:uppercase;border:.5px solid var(--rule);padding:1px 5px;color:var(--dim);flex:none;}
.tag.m{border-color:var(--pink);color:var(--pink);}
.overdue{color:var(--pink);}
.empty{color:var(--dimmer);font-size:10px;padding:22px 0;}
.warnbar{position:sticky;top:0;z-index:95;background:#000;color:#fff;display:flex;gap:16px;
  align-items:center;justify-content:space-between;padding:9px 22px;font-size:10.5px;line-height:1.4;}
.warnbar[hidden]{display:none;}
.warnbar b{font-weight:600;}
.wb-acts{display:flex;gap:14px;flex:none;}
.warnbar button{color:#fff;font-size:9px;letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;}
.saveflash{position:fixed;bottom:18px;right:20px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--pink);opacity:0;transition:opacity .25s;z-index:120;}
.saveflash.on{opacity:1;}

.log-wrap{max-width:840px;}
.compose{position:sticky;top:98px;background:var(--paper);z-index:40;border:.5px solid var(--ink);padding:10px 12px;margin-bottom:22px;}
.compose-top{display:flex;gap:10px;align-items:center;margin-bottom:7px;}
.compose-top select{border:none;border-bottom:.5px solid var(--rule);background:none;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);padding:2px 0;}
.compose textarea{width:100%;border:none;background:none;resize:none;min-height:34px;line-height:1.5;padding:0;overflow:hidden;}
.compose textarea::placeholder{color:var(--dimmer);}
.compose-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px;padding-top:7px;border-top:.5px solid var(--rule-soft);}
.day{margin-bottom:26px;}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;border-bottom:.5px solid var(--ink);padding-bottom:6px;margin-bottom:10px;}
.day-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
.day-title.today{color:var(--pink);}
.day-acts{display:flex;gap:12px;}
.day-acts button{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer);}
.day-acts button:hover{color:var(--pink);}
.msg{display:grid;grid-template-columns:74px 1fr auto;gap:12px;padding:5px 0;align-items:baseline;}
.msg:hover{background:#fafafa;}
.msg:hover .msg-acts{opacity:1;}
.msg-who{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);text-align:right;padding-top:1px;}
.msg-body{white-space:pre-wrap;word-break:break-word;}
.msg-body .mention{color:var(--pink);}
.msg-body .hash{border-bottom:.5px solid var(--rule);}
.msg-acts{opacity:0;display:flex;gap:9px;align-items:baseline;}
.msg-acts button{font-size:9px;color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase;}
.msg-acts button:hover{color:var(--pink);}
.msg-time{font-size:9px;color:var(--dimmer);font-variant-numeric:tabular-nums;}
.msg.note .msg-body{border-left:2px solid var(--pink);padding-left:9px;}

.bwrap{position:relative;height:calc(100vh - 230px);min-height:560px;overflow:hidden;
  border:.5px solid var(--rule-soft);background:#fff;cursor:default;}
.bwrap.grab{cursor:grab;}
.bwrap.over{border-color:var(--ink);}
.bstage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
.bgrid{position:absolute;cursor:move;transform-origin:0 0;}
.bh.gse{right:-9px;bottom:-9px;width:15px;height:15px;background:#fff;border:1px solid var(--ink);
  border-radius:50%;cursor:nwse-resize;z-index:25;}
.phone{border:.5px solid var(--rule);background:#fff;padding:12px;width:660px;}
.phone-head{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-bottom:9px;padding-bottom:7px;border-bottom:.5px solid var(--rule-soft);}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
.igt{position:relative;aspect-ratio:4/5;background:#f7f7f7;overflow:hidden;cursor:pointer;}
.igt.empty{background:none;border:.5px dashed var(--rule-soft);display:flex;align-items:center;justify-content:center;}
.igt.on{outline:2px solid var(--ink);outline-offset:-2px;}
.igt.over{outline:2.5px solid var(--ink);outline-offset:-2.5px;background:#ececec;}
.igt.over:after{content:"";position:absolute;inset:0;border:2px solid #000;pointer-events:none;}
.igt.posted{opacity:.55;}
.igt img,.igt video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.igph{font-size:11px;color:var(--dim);padding:8px;text-align:center;line-height:1.4;}
.igb{position:absolute;top:6px;right:7px;font-size:12px;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.6);}
.ign{position:absolute;bottom:5px;left:7px;font-size:9px;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.7);}
.igt.empty .ign{color:var(--dimmer);text-shadow:none;position:static;}
.igo{position:absolute;top:0;left:0;width:100%;height:3px;opacity:.85;}
.igd{position:absolute;bottom:5px;right:6px;font-size:9px;background:rgba(255,255,255,.9);padding:1px 4px;}
.igd.late{background:#000;color:#fff;}
.igx{position:absolute;top:2px;left:4px;font-size:13px;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.8);opacity:0;}
.igt:hover .igx{opacity:1;}
.bi{position:absolute;cursor:move;transform-origin:50% 50%;}
.bi img,.bi video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.bi.sel{outline:1.5px solid var(--ink);outline-offset:2px;}
.bnote{width:100%;height:100%;background:#fff;border:.5px solid var(--rule);padding:10px 12px;
  font-size:12px;line-height:1.45;overflow:hidden;white-space:pre-wrap;}
.bnote.dim{color:var(--dimmer);}
.bh{position:absolute;width:11px;height:11px;background:#fff;border:1px solid var(--ink);border-radius:50%;}
.bh.se{right:-7px;bottom:-7px;cursor:nwse-resize;}
.bh.rot{left:50%;top:-22px;margin-left:-5.5px;cursor:grab;}
.btools{position:absolute;left:0;top:-30px;display:flex;gap:4px;background:#fff;border:.5px solid var(--ink);padding:2px 4px;}
.btools button{font-size:12px;line-height:1;padding:2px 5px;}
.btools button:hover{background:#000;color:#fff;}
.scrollnote{display:none;}
@media(max-width:700px){.scrollnote{display:block;}}
.bhint{position:absolute;left:14px;bottom:12px;z-index:5;color:var(--dimmer);background:#fff;padding:2px 0;
  max-width:66%;line-height:1.45;}
.insp{position:absolute;right:0;top:0;bottom:0;width:330px;background:#fff;border-left:.5px solid var(--ink);
  padding:14px 16px 20px;overflow:auto;z-index:20;box-shadow:-2px 0 14px rgba(0,0,0,.06);}
.insp-shot{width:100%;aspect-ratio:4/5;background:#f2f2f2;overflow:hidden;margin-bottom:12px;}
.insp-shot img,.insp-shot video{width:100%;height:100%;object-fit:cover;display:block;}
.insp-none{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--dimmer);font-size:11px;text-align:center;line-height:1.6;}
.insp-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border-bottom:.5px solid var(--rule-soft);padding-bottom:10px;margin-bottom:14px;}
.insp-meta span{display:flex;align-items:center;gap:5px;}
.pe{border:.5px solid var(--ink);padding:14px 15px;margin:18px auto 0;max-width:660px;}
.pe-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.5px solid var(--rule-soft);
  padding-bottom:7px;margin-bottom:12px;}
.pe-h b{font-size:11px;font-weight:500;}
.pe-h button{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);}
.pe-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.pe-acts{display:flex;gap:9px;justify-content:flex-end;margin-top:12px;}
.drop-hint{color:var(--dimmer);font-size:10px;padding:26px 0;text-align:center;}

.daily{display:flex;gap:9px;align-items:baseline;padding:5px 0;border-bottom:.5px solid var(--rule-soft);max-width:640px;}
.daily.done span{color:#555;text-decoration:line-through;}

/* ---------- HOME ---------- */
.home{min-height:100vh;max-width:560px;margin:0 auto;padding:46px 6px 34px;
  display:flex;flex-direction:column;}
.home-mast{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:38px;}
.home-mast .lg{font-size:19px;font-weight:400;line-height:1;}
.home-mast .dt{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding-top:5px;}
.obj-list{margin-bottom:auto;}
.obj{display:flex;align-items:baseline;justify-content:space-between;gap:20px;width:100%;
  text-align:left;padding:5px 0;cursor:pointer;}
.obj .t{font-size:12.5px;line-height:1.5;}
.obj:hover .t{text-decoration:underline;}
.obj .m{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
  white-space:nowrap;font-variant-numeric:tabular-nums;opacity:0;flex:none;}
.obj:hover .m{opacity:1;}
.obj.dim .t{color:var(--dimmer);}
.home-eyebrow{display:none;}
.home-foot{margin-top:64px;}
.home-foot .who{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;line-height:1.7;color:var(--ink);}
.home-foot .who span{color:var(--dim);}
.morerow{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 20px;}
.morerow button{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  text-decoration:underline;text-underline-offset:3px;}
.morerow button:hover{color:var(--ink);}
.home-sub{display:flex;flex-direction:column;gap:3px;margin-top:20px;}
.home-sub button{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;
  text-decoration:underline;text-underline-offset:2px;}
.home-sub button:hover{color:var(--dim);}
.home-sub .badge2{font-size:9px;vertical-align:super;margin-left:3px;}
@media(max-width:640px){.home{padding:32px 4px 28px;} .home-foot{margin-top:44px;}}

/* ---------- OBJECTIVE PAGE ---------- */
.week-head{display:flex;justify-content:space-between;align-items:baseline;max-width:1000px;
  margin:28px 0 6px;padding-bottom:5px;border-bottom:.5px solid var(--ink);font-size:11px;font-weight:500;}
.goals{margin:14px 0 4px;max-width:720px;border-top:.5px solid var(--rule);}
.tier{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:9px 0;border-bottom:.5px solid var(--rule-soft);}
.tier-tag{font-size:9px;letter-spacing:.1em;color:var(--dimmer);padding-top:3px;}
.goal{font-size:13px;line-height:1.4;padding:2px 0;}
.goals-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);margin-top:22px;}
.obj-head{max-width:900px;margin-bottom:6px;}
.obj-head .big{font-size:19px;font-weight:400;line-height:1.25;}
.obj-head .note{font-size:11px;color:var(--dim);margin-top:6px;max-width:560px;}
.backhome{font-size:9px;color:var(--dimmer);
  display:inline-block;margin-bottom:26px;}
.backhome:hover{color:var(--pink);}

.outcomes{max-width:660px;margin-bottom:4px;}
.outc{font-size:13.5px;font-weight:400;padding:8px 0 8px 16px;position:relative;}
.outc:before{content:'';position:absolute;left:2px;top:1.05em;width:4px;height:4px;background:var(--ink);}
@media(max-width:640px){.outc{font-size:14px;}}
.funnel{list-style:none;margin:0 0 4px;padding:0;max-width:1000px;}
.funnel li{position:relative;padding:1px 0 1px 18px;font-size:12.5px;line-height:1.5;}
.funnel li:before{content:"";position:absolute;left:4px;top:.7em;width:5px;height:5px;
  border-radius:50%;background:var(--ph,#000);opacity:.75;}
.phz{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:16px 0 5px;}
.phz:first-child{margin-top:2px;}
.phz i{width:9px;height:9px;border-radius:50%;display:inline-block;opacity:.6;}
.farr{color:var(--ink);}

async function idbPut(k,v){ try{const db=await idb();return new Promise(res=>{
  const t=db.transaction(IDB_ST,'readwrite');t.objectStore(IDB_ST).put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);});}catch(e){return false;} }

  const t=db.transaction(IDB_ST,'readonly');const q=t.objectStore(IDB_ST).get(k);

function wedges(cx,cy,r,cols){
  if(!cols.length) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${DEFCOL}" fill-opacity="${ALPHA}"/>`;
  if(cols.length===1) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${cols[0]}" fill-opacity="${ALPHA}"/>`;
  const step=(Math.PI*2)/cols.length;
  return cols.map((c,i)=>{
    const a0=-Math.PI/2+i*step, a1=a0+step;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    return `<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${step>Math.PI?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${c}" fill-opacity="${ALPHA}"/>`;
  }).join('');
}

    return landed?money(landed)+' in · '+kk(low)+'–'+kk(high)+' open' : kk(low)+'–'+kk(high)+' open';
  }
  const open=objItems(o).filter(i=>i.status!=='done');
  const flagged=open.filter(i=>i.flag).length;
  const od=open.filter(i=>i.due&&i.due<todayISO()).length;
  if(od) return od+' overdue';
  if(flagged) return flagged+' now';
  return open.length+' open';
}

function wrapText(t,per){
  const w=String(t).split(' '), out=[]; let line='';
  w.forEach(x=>{ if((line+' '+x).trim().length>per){out.push(line.trim());line=x;} else line+=' '+x; });
  if(line.trim())out.push(line.trim());
  return out.slice(0,4);
}
function ensureSides(card){
  if(!card.rails||!card.rails.length){
    const ax=card.axes||{L:'Backend',C:'Convergence',R:'Frontend'};
    card.rails=[{key:'L',name:ax.L||'Backend'},
                {key:'C',name:ax.C||'Convergence',spine:true},
                {key:'R',name:ax.R||'Frontend'}];
  }
  card.rails.forEach(r=>{
    if(/^backend engine$/i.test(r.name)) r.name='Backend';
    if(/^creative$/i.test(r.name)) r.name='Frontend';
  });
  if(!card.rails.some(r=>r.spine)) card.rails[Math.floor(card.rails.length/2)].spine=true;
  const keys=card.rails.map(r=>r.key);
  card.items.forEach(it=>{ if(!it.side||!keys.includes(it.side)) it.side=keys[0]; });
}
function boardSnapshot(card){
  return JSON.parse(JSON.stringify({items:card.items,rails:card.rails,conns:card.conns||[]}));
}
function saveBoard(card,name,by){
  card.boards=card.boards||[];
  const b={id:uid(),name:name,by:by||S.me,at:Date.now(),data:boardSnapshot(card)};
  card.boards.push(b); card.activeBoard=b.id; save(); return b;
}
function updateBoard(card){
  const b=(card.boards||[]).find(x=>x.id===card.activeBoard);
  if(!b) return false;
  b.data=boardSnapshot(card); b.at=Date.now(); save(); return true;
}
function loadBoard(card,id){
  const b=(card.boards||[]).find(x=>x.id===id); if(!b) return false;
  snap('board');
  card.items=JSON.parse(JSON.stringify(b.data.items||[]));
  card.rails=JSON.parse(JSON.stringify(b.data.rails||card.rails));
  card.conns=JSON.parse(JSON.stringify(b.data.conns||[]));
  card.activeBoard=id; SELS=new Set(); SEL=null; save(); return true;
}
function boardLabel(b){
  const d=new Date(b.at);
  const when=d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+
    d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return b.name+' · '+when+((b.by&&b.by.toLowerCase()!==b.name.toLowerCase())?' · '+b.by:'');
}
function railGeo(card){
  const GAP=215, PAD=320;
  let list=card.rails.map((r,i)=>({...r,i}));
  if(FOCUS_RAIL&&list.some(r=>r.key===FOCUS_RAIL)) list=list.filter(r=>r.key===FOCUS_RAIL);
  const rails=list.map((r,j)=>({...r,x:PAD+j*GAP}));
  const width=PAD*2+(rails.length-1)*GAP;
  const spine=rails.find(r=>r.spine)||null;
  return {rails,width,spine};
}
function nodeHeight(it,per){
  const main=wrapText(it.text,per).length;
  const subs=(it.note||'').split('\n').filter(Boolean);
  let subLines=0; subs.forEach(sb=>{subLines+=wrapText(sb,per+4).length;});
  if(HIDDEN.has(it.id)) return 14;
  return main*(it.dot?17:22) + (subLines?16+subLines*19+subs.length*3:0);
}
function flowLayout(card,only){
  const top=126, gap=50, minStep=112;
  const {rails,spine}=railGeo(card);
  const src=only||card.items;
  const pos=new Map(), ends={};
  rails.forEach(r=>{
    const list=src.filter(i=>i.side===r.key && !(r.spine&&spine));
    let y=top, end=top;
    list.forEach((it,i)=>{
      const fy = (typeof it.y==='number') ? it.y : y;
      pos.set(it.id,{key:r.key,x:r.x,y:fy,r:it.dot?7:30});
      y=fy; end=Math.max(end,fy);
      const h=nodeHeight(it,26), next=list[i+1], nh=next?nodeHeight(next,26):0;
      let stepY;
      if(!next) stepY=0;
      else if(it.dot&&next.dot) stepY=Math.max(36,h/2+nh/2+12);
      else if(it.dot&&!next.dot) stepY=Math.max(78,h/2+nh/2+38);
      else if(!it.dot&&next.dot) stepY=Math.max(58,h/2+nh/2+14);
      else stepY=Math.max(minStep,h/2+nh/2+gap);
      y+=stepY;
    });
    ends[r.key]=Math.max(end, r.len||0);
  });
  const feederEnds=rails.filter(r=>!r.spine).map(r=>ends[r.key]);
  const conv=(feederEnds.length?Math.max(...feederEnds):top)+150;
  let height;
  if(spine){
    const C=src.filter(i=>i.side===spine.key);
    let cy0=conv+118;
    C.forEach((it,i)=>{const fy=(typeof it.y==='number')?it.y:cy0+i*112;
      pos.set(it.id,{key:spine.key,x:spine.x,y:fy,r:it.dot?7:34});});
    const cys=C.map(it=>pos.get(it.id).y+70);
    ends[spine.key]=Math.max(conv, cys.length?Math.max(...cys):conv, spine.len||0);
    height=ends[spine.key]+160;
  } else {
    height=(feederEnds.length?Math.max(...feederEnds):top)+180;
  }
  return {pos,conv,ends,height,rails,spine};
}
let FLOW_GEO=null, EDIT_NEW=null, SEL=null, OPEN_LINKS=null, FOCUS_RAIL=null;
let HIDDEN=new Set();
function groupOf(card,id){
  const i=card.items.findIndex(x=>x.id===id);
  if(i<0) return [];
  const out=[card.items[i]];
  for(let k=i+1;k<card.items.length;k++){
    const it=card.items[k];
    if(it.side!==card.items[i].side||!it.dot) break;
    out.push(it);
  }
  return out;
}
function hiddenChildren(card){
  const set=new Set();
  card.items.forEach(p=>{ if(HIDDEN.has(p.id)) groupOf(card,p.id).slice(1).forEach(c=>set.add(c.id)); });
  return set;
}
function visibleItems(card){ const kids=hiddenChildren(card); return card.items.filter(i=>!kids.has(i.id)); }
let SELS=new Set();
const UNDO_STACK=[];
function snap(label,withAssets){
  try{
    UNDO_STACK.push({label,s:JSON.stringify(S),a:withAssets?JSON.stringify(A):null});
    while(UNDO_STACK.length>15) UNDO_STACK.shift();
    let heavy=0; for(let i=UNDO_STACK.length-1;i>=0;i--){ if(UNDO_STACK[i].a){heavy++; if(heavy>2)UNDO_STACK[i].a=null;} }
  }catch(e){}
}
function undoLast(){
  const u=UNDO_STACK.pop(); if(!u) return null;
  try{
    S=JSON.parse(u.s); if(u.a) A=JSON.parse(u.a);
    SEL=null; save(); if(u.a) saveA(); render();
    return u.label||'change';
  }catch(e){ return null; }
}

function matches(c){

  if(filterOwner&&!c.items.some(i=>i.owner===filterOwner)) return false;

    if(!(c.title.toLowerCase().includes(s)||c.items.some(i=>i.text.toLowerCase().includes(s)))) return false;}
  return true;
}

function viewFocus(){

function postLog(text,author,threadId){
  const t=text.trim(); if(!t) return;
  const tid=threadId||'t-main';
  if(/^todo:/i.test(t)){
    const body=t.replace(/^todo:\s*/i,'');
    const card=S.cards.find(c=>c.title==='Priorities')||S.cards[0];
    const m=body.match(/@([A-Za-z][\w'-]*)/);
    const owner=m?(names().find(n=>n.toLowerCase()===m[1].toLowerCase())||''):'';
    card.items.push(P(body.replace(/@[A-Za-z][\w'-]*/,'').trim(),owner,{flag:true}));
    S.log.push({id:uid(),ts:Date.now(),date:todayISO(),author,kind:'note',threadId:tid,
      text:'Task added to '+card.title+': '+body});
  } else {
    S.log.push({id:uid(),ts:Date.now(),date:todayISO(),author,text:t,kind:'msg',threadId:tid,reactions:{}});
  }
  save();
}
function threadLabel(m){
  const t=(S.threads||[]).find(x=>x.id===(m.threadId||'t-main'));

function dayText(d){
  const msgs=S.log.filter(l=>dayKey(l)===d).sort((a,b)=>a.ts-b.ts);
  return `radish log\n${fmtDay(d)}\n\n`+msgs.map(m=>`[${fmtTime(m.ts)}] (${threadLabel(m)}) ${m.author}: ${m.text}`).join('\n')+'\n';
}
function printDay(d){
  const msgs=S.log.filter(l=>dayKey(l)===d).sort((a,b)=>a.ts-b.ts);
  $('#printroot').innerHTML=`<div class="p-head"><div class="p-title">radish Ops · Daily Log</div>
    <div style="font-size:9px;letter-spacing:.12em;margin-top:4px">${fmtDay(d)}</div></div>`+
    (msgs.map(m=>`<div class="p-msg"><div class="p-who">${esc(m.author)} · ${fmtTime(m.ts)}<br><span style="opacity:.55">${esc(threadLabel(m))}</span></div><div class="p-body">${esc(m.text)}</div></div>`).join('')
      ||'<div class="p-body">No entries.</div>');
  window.print();
  setTimeout(()=>{$('#printroot').innerHTML='';},800);
}

/* ================= GRID PLANNER ================= */
const POST_KINDS=[['photo','Photo'],['reel','Reel'],['carousel','Carousel'],['story','Story']];
const POST_STATUS=[['idea','Idea'],['shot','Shot'],['edited','Edited'],['approved','Approved'],['posted','Posted']];
function tilePost(t){ return (t&&typeof t==='object')?t:(t?{id:uid(),assetId:t,kind:'photo',status:'idea'}:null); }
function normGrid(){
  S.grid||={tiles:new Array(9).fill(null)};
  S.grid.tiles=S.grid.tiles.map(t=>typeof t==='string'?tilePost(t):t);
  S.grid.handle||='@maddiessecret';
}
function normBoard(){
  S.board||={items:[],pan:{x:28,y:24},zoom:1,gx:0,gy:0,gs:0.58};
  S.board.items||=[]; S.board.pan||={x:28,y:24}; S.board.zoom||=1;
  if(typeof S.board.gx!=='number'){S.board.gx=0;S.board.gy=0;}
  if(typeof S.board.gs!=='number') S.board.gs=0.58;
}
function viewGrid(){
  normGrid(); normBoard();
  const tiles=S.grid.tiles;
  const posts=tiles.filter(Boolean);
  const today=todayISO();
  const B=S.board, z=B.zoom;

  const tileHTML=tiles.map((p,n)=>{
    const a=p&&p.assetId?asset(p.assetId):null;
    if(!a) return `<div class="igt empty" data-tile="${n}"><span class="ign">${n+1}</span></div>`;
    const media=a.type==='video'
      ? `<video src="${a.src}" muted playsinline preload="metadata" style="object-position:${a.pos||'50% 50%'}"></video>`
      : `<img src="${a.src}" alt="" style="object-position:${a.pos||'50% 50%'}">`;
    return `<div class="igt" data-tile="${n}">${media}
      <span class="ign">${n+1}</span><button class="igx" data-untile="${n}">&times;</button></div>`;
  }).join('');

  const items=[...B.items].sort((x,y)=>(x.z||0)-(y.z||0)).map(it=>{
    const a=it.assetId?asset(it.assetId):null;
    const isSel=B.sel===it.id;
    let inner='';
    if(it.kind==='note') inner=`<div class="bnote">${esc(it.text||'')}</div>`;
    else if(a&&a.type==='video') inner=`<video src="${a.src}" muted loop playsinline preload="metadata"></video>`;
    else if(a) inner=`<img src="${a.src}" alt="">`;
    else inner=`<div class="bnote dim">missing</div>`;
    return `<div class="bi ${isSel?'sel':''}" data-bi="${it.id}"
      style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;z-index:${it.z||1};
      transform:rotate(${it.rot||0}deg) scaleX(${it.flip?-1:1});">
      ${inner}
      ${isSel?`<span class="bh rot" data-h="rot"></span>
        <span class="bh se" data-h="se"></span>
        <span class="btools">
          <button data-bflip="${it.id}" title="Flip">⇋</button>
          <button data-bfront="${it.id}" title="Bring to front">↑</button>
          ${it.kind==='note'?`<button data-bedit="${it.id}" title="Edit">✎</button>`:''}
          <button data-bdel="${it.id}" title="Delete">×</button>
        </span>`:''}
    </div>`;
  }).join('');

  return `<div class="detail-top"><div class="detail-title">Grid</div>
    <div style="display:flex;gap:13px;align-items:baseline;flex-wrap:wrap">
      <button class="back" id="grid-add">+ Media</button>
      <button class="back" id="board-note">+ Note</button>
      <button class="back" id="grid-shift">Shift down</button>
      <span class="tiny dim">Grid</span>
      <button class="back" id="grid-smaller">&minus;</button>
      <button class="back" id="grid-bigger">+</button>
      <button class="back" id="board-fit">Fit</button>
      <button class="back" id="board-out">&minus;</button>
      <span class="tiny dim mono" id="board-z">${Math.round(z*100)}%</span>
      <button class="back" id="board-in">+</button>
    </div></div>
  <div class="stats">
    <div class="stat"><b>${posts.filter(p=>p.assetId).length}</b><span>Slots filled</span></div>
    <div class="stat"><b>${tiles.length-posts.filter(p=>p.assetId).length}</b><span>Empty</span></div>
    <div class="stat"><b>${B.items.length}</b><span>On the canvas</span></div>
  </div>
  <div class="bwrap" id="bwrap">
    <div class="bstage" id="bstage" style="transform:translate(${B.pan.x}px,${B.pan.y}px) scale(${z});">
      <div class="bgrid" id="bgrid" style="left:${B.gx}px;top:${B.gy}px;transform:scale(${B.gs});">
        <span class="bh gse" id="gse" title="Drag to resize the grid"></span>
        <div class="phone">
          <div class="phone-head"><span>${esc(S.grid.handle)}</span><span>${posts.length} posts</span></div>
          <div class="ig-grid" id="ig-grid">${tileHTML}</div>
        </div>
      </div>
      ${items}
    </div>
    <div class="bhint tiny">Drop images or video anywhere on the right. Drag to move, corner to scale, top handle to turn. Drag one onto a slot to make it that post.</div>
  </div>`;
}
function boardAdd(assetId,x,y,w,h,kind){
  normBoard();
  const z=(S.board.items.reduce((m,i)=>Math.max(m,i.z||1),0))+1;
  const it={id:uid(),kind:kind||'image',assetId:assetId||null,x:Math.round(x),y:Math.round(y),
    w:Math.round(w||220),h:Math.round(h||275),rot:0,flip:false,z};
  if(kind==='note') it.text='';
  S.board.items.push(it); return it;
}
function wireGrid(){
  const wrap=$('#bwrap'), stage=$('#bstage');
  if(!wrap||!stage) return;
  normGrid(); normBoard();
  const B=S.board;
  const toStage=e=>{const r=wrap.getBoundingClientRect();
    return {x:(e.clientX-r.left-B.pan.x)/B.zoom, y:(e.clientY-r.top-B.pan.y)/B.zoom};};
  const applyTransform=()=>{stage.style.transform=`translate(${B.pan.x}px,${B.pan.y}px) scale(${B.zoom})`;
    const zl=$('#board-z'); if(zl) zl.textContent=Math.round(B.zoom*100)+'%';};

  /* ---- zoom ---- */
  wrap.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){
      e.preventDefault();
      const r=wrap.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
      const before=B.zoom, next=Math.min(3,Math.max(0.15,before*(1-e.deltaY*0.0016)));
      B.pan.x = mx-(mx-B.pan.x)*(next/before);
      B.pan.y = my-(my-B.pan.y)*(next/before);
      B.zoom=next; applyTransform(); clearTimeout(wrap.__zt); wrap.__zt=setTimeout(save,400);
    } else { e.preventDefault(); B.pan.x-=e.deltaX; B.pan.y-=e.deltaY; applyTransform();
      clearTimeout(wrap.__pt); wrap.__pt=setTimeout(save,400); }
  },{passive:false});
  const zoomBy=f=>{const r=wrap.getBoundingClientRect(), mx=r.width/2, my=r.height/2;
    const before=B.zoom, next=Math.min(3,Math.max(0.15,before*f));
    B.pan.x=mx-(mx-B.pan.x)*(next/before); B.pan.y=my-(my-B.pan.y)*(next/before);
    B.zoom=next; applyTransform(); save();};
  $('#board-in').onclick=()=>zoomBy(1.2);
  $('#board-out').onclick=()=>zoomBy(1/1.2);
  $('#board-fit').onclick=()=>{B.zoom=1;B.pan={x:28,y:24};B.gx=0;B.gy=0;B.gs=0.58;applyTransform();save();render();};
  $('#grid-bigger').onclick=()=>{B.gs=Math.min(2,B.gs*1.15);save();render();};
  $('#grid-smaller').onclick=()=>{B.gs=Math.max(0.2,B.gs/1.15);save();render();};

  /* ---- pan ---- */
  let panning=null, space=false;
  window.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){space=true;wrap.classList.add('grab');}});
  window.addEventListener('keyup',e=>{if(e.code==='Space'){space=false;wrap.classList.remove('grab');}});
  wrap.addEventListener('mousedown',e=>{
    const onItem=e.target.closest('.bi'), onGrid=e.target.closest('.bgrid');
    if(e.button===1||space||(!onItem&&!onGrid)){
      panning={x:e.clientX,y:e.clientY,px:B.pan.x,py:B.pan.y};
      if(!onItem&&!onGrid&&B.sel){B.sel=null;render();return;}
      e.preventDefault();
    }
  });
  window.addEventListener('mousemove',e=>{
    if(!panning)return;
    B.pan.x=panning.px+(e.clientX-panning.x); B.pan.y=panning.py+(e.clientY-panning.y); applyTransform();
  });
  window.addEventListener('mouseup',()=>{ if(panning){panning=null;save();} });

  /* ---- move, scale, turn ---- */
  let act=null;
  stage.querySelectorAll('.bi').forEach(el=>{
    const id=el.dataset.bi;
    el.addEventListener('mousedown',e=>{
      if(e.target.closest('.btools'))return;
      e.stopPropagation();
      const it=B.items.find(i=>i.id===id); if(!it)return;
      if(B.sel!==id){B.sel=id;render();return;}
      const h=e.target.dataset&&e.target.dataset.h;
      const p=toStage(e);
      act={id,mode:h||'move',sx:p.x,sy:p.y,ox:it.x,oy:it.y,ow:it.w,oh:it.h,orot:it.rot||0,
        cx:it.x+it.w/2, cy:it.y+it.h/2};
      e.preventDefault();
    });
  });
  window.addEventListener('mousemove',e=>{
    if(!act)return;
    const it=B.items.find(i=>i.id===act.id); if(!it)return;
    const p=toStage(e);
    if(act.mode==='move'){ it.x=Math.round(act.ox+(p.x-act.sx)); it.y=Math.round(act.oy+(p.y-act.sy)); }
    else if(act.mode==='se'){
      const f=Math.max(0.12,(p.x-act.ox)/Math.max(20,act.ow));
      it.w=Math.max(40,Math.round(act.ow*f)); it.h=Math.max(40,Math.round(act.oh*f));
    } else if(act.mode==='rot'){
      const ang=Math.atan2(p.y-act.cy,p.x-act.cx)*180/Math.PI+90;
      it.rot=Math.round(e.shiftKey?Math.round(ang/15)*15:ang);
    }
    const el=stage.querySelector(`.bi[data-bi="${act.id}"]`);
    if(el){el.style.left=it.x+'px';el.style.top=it.y+'px';el.style.width=it.w+'px';el.style.height=it.h+'px';
      el.style.transform=`rotate(${it.rot||0}deg) scaleX(${it.flip?-1:1})`;}
    if(act.mode==='move'&&it.assetId){
      if(el) el.style.pointerEvents='none';
      const under=document.elementFromPoint?document.elementFromPoint(e.clientX,e.clientY):null;
      const tile=under&&under.closest&&under.closest('.igt');
      document.querySelectorAll('.igt.over').forEach(t=>{ if(t!==tile) t.classList.remove('over'); });
      if(tile) tile.classList.add('over');
    }
  });
  window.addEventListener('mouseup',e=>{
    if(!act)return;
    const el0=stage.querySelector(`.bi[data-bi="${act.id}"]`);
    const it=B.items.find(i=>i.id===act.id);
    document.querySelectorAll('.igt.over').forEach(t=>t.classList.remove('over'));
    if(it&&act.mode==='move'&&it.assetId){
      const t=document.elementFromPoint?document.elementFromPoint(e.clientX,e.clientY):null;
      if(el0) el0.style.pointerEvents='';
      const tile=t&&t.closest&&t.closest('.igt');
      if(tile){
        const n=+tile.dataset.tile;
        const p2=S.grid.tiles[n];
        if(p2) p2.assetId=it.assetId;
        else S.grid.tiles[n]={id:uid(),assetId:it.assetId,kind:'photo',status:'shot',caption:'',date:''};
        act=null; save(); render(); flashMsg('Masked into slot '+(n+1),1800); return;
      }
    }
    if(el0) el0.style.pointerEvents='';
    act=null; save();
  });

  /* ---- tools ---- */
  document.querySelectorAll('[data-bflip]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const it=B.items.find(i=>i.id===b.dataset.bflip); if(it){it.flip=!it.flip;save();render();}});
  document.querySelectorAll('[data-bfront]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const it=B.items.find(i=>i.id===b.dataset.bfront);
    if(it){it.z=(B.items.reduce((m,i)=>Math.max(m,i.z||1),0))+1;save();render();}});
  document.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    snap('item'); B.items=B.items.filter(i=>i.id!==b.dataset.bdel); B.sel=null; save(); render();
    flashMsg('Deleted. Cmd Z to undo',2000);});
  document.querySelectorAll('[data-bedit]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const it=B.items.find(i=>i.id===b.dataset.bedit); if(!it)return;
    const v=prompt('Note',it.text||''); if(v===null)return; it.text=v; save(); render();});

  /* ---- drop files anywhere ---- */
  wrap.addEventListener('dragover',e=>{e.preventDefault();wrap.classList.add('over');});
  wrap.addEventListener('dragleave',()=>wrap.classList.remove('over'));
  wrap.addEventListener('drop',e=>{
    e.preventDefault();wrap.classList.remove('over');
    if(e.dataTransfer.files&&e.dataTransfer.files.length){
      const p=toStage(e); addMedia(e.dataTransfer.files,null,p);
    }
  });

  /* ---- the grid itself can be moved ---- */
  const bgrid=$('#bgrid');
  if(bgrid){
    let gd=null;
    bgrid.addEventListener('mousedown',e=>{
      if(e.target.id==='gse'){
        const p0=toStage(e);
        const gs0=B.gs;
        const grab=ev=>{const p=toStage(ev);
          B.gs=Math.max(0.2,Math.min(2,(p.x-B.gx)/660));
          bgrid.style.transform='scale('+B.gs+')';};
        const done=()=>{window.removeEventListener('mousemove',grab);window.removeEventListener('mouseup',done);save();render();};
        window.addEventListener('mousemove',grab);window.addEventListener('mouseup',done);
        e.stopPropagation();e.preventDefault();return;
      }
      if(e.target.closest('.igt'))return;
      const p=toStage(e); gd={sx:p.x,sy:p.y,ox:B.gx,oy:B.gy}; e.stopPropagation(); e.preventDefault();
    });
    window.addEventListener('mousemove',e=>{ if(!gd)return; const p=toStage(e);
      B.gx=Math.round(gd.ox+(p.x-gd.sx)); B.gy=Math.round(gd.oy+(p.y-gd.sy));
      bgrid.style.left=B.gx+'px'; bgrid.style.top=B.gy+'px'; });
    window.addEventListener('mouseup',()=>{ if(gd){gd=null;save();} });
  }

  /* ---- slots ---- */

  document.querySelectorAll('[data-untile]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();snap('post');const n=+b.dataset.untile;
    S.grid.tiles[n]=null; save();render();flashMsg('Cleared. Cmd Z to undo',2000);});

  /* ---- toolbar ---- */
  $('#grid-add').onclick=()=>$('#media-in').click();
  $('#board-note').onclick=()=>{
    const t=prompt('Note'); if(t===null)return;
    const r=wrap.getBoundingClientRect();
    const it=boardAdd(null,(r.width/2-B.pan.x)/B.zoom-100,(r.height/2-B.pan.y)/B.zoom-60,220,140,'note');
    it.text=t; B.sel=it.id; save(); render();};
  $('#grid-shift').onclick=()=>{
    const t=S.grid.tiles, last=t[t.length-1];
    for(let i=t.length-1;i>0;i--) t[i]=t[i-1];
    t[0]=null; save();render();};
}

  <div class="sec-label">Ledger</div>

  ${pays.map(p=>`<tr><td class="tiny mono dim">${fmtDate(p.date)}</td><td>${esc(p.person)}</td>

function viewCalendar(){
  const map={};
  allItems().filter(i=>i.due&&i.status!=='done').forEach(i=>(map[i.due]||=[]).push({type:'task',text:i.text,sub:i.card,who:i.owner}));
  S.meetings.forEach(m=>{if(m.date)(map[m.date]||=[]).push({type:'meeting',text:m.title,sub:m.notes||'',who:m.who});});

  const days=Object.keys(map).sort(), today=todayISO();
  return `<div class="detail-top"><div class="detail-title">Calendar</div>
    <button class="btn p" id="add-mtg-global">+ Meeting</button></div>`+
    (days.length?days.map(d=>`<div class="cal-day">
      <div class="cal-date ${d===today?'today':''} ${d<today?'overdue':''}">${fmtDate(d)}${d===today?' · TODAY':''}</div>
      <div>${map[d].map(x=>`<div class="cal-item"><span class="tag ${x.type==='meeting'?'m':''}">${x.type==='meeting'?'Mtg':(x.type==='post'?'Post':'Due')}</span>
        <span style="flex:1">${esc(x.text)}${x.sub?`<span class="tiny dim"> · ${esc(x.sub)}</span>`:''}</span>
        ${x.who?`<span class="tiny pink up">${esc(x.who)}</span>`:''}</div>`).join('')}</div></div>`).join('')
    :'<div class="empty">Nothing scheduled.</div>');
}

    <div class="tiny dim up" style="margin-top:4px">${esc(c.group)}${c.kicker?' · '+esc(c.kicker):''}</div></div>
    <div style="display:flex;gap:12px;align-items:baseline">
      <button class="back" id="rename-card">Rename</button>
      <button class="back" id="del-card">Delete card</button>

    ${c.items.map(i=>`<tr>

      <td><input data-f="text" data-i="${i.id}" value="${esc(i.text)}" style="border:none;background:none;width:100%"></td>
      <td><select data-f="owner" data-i="${i.id}" class="tiny">${owners.map(o=>`<option ${i.owner===o?'selected':''}>${esc(o)}</option>`).join('')}</select></td>
      <td><input data-f="tier" data-i="${i.id}" value="${esc(i.tier||'')}" class="tiny" style="border:none;background:none;width:64px"></td>
      <td class="num"><input data-f="low" data-i="${i.id}" value="${i.low||0}" class="mono" style="border:none;background:none;width:70px;text-align:right"></td>
      <td class="num"><input data-f="high" data-i="${i.id}" value="${i.high||0}" class="mono" style="border:none;background:none;width:70px;text-align:right"></td>
      <td><input type="date" data-f="due" data-i="${i.id}" value="${i.due||''}" class="tiny" style="border:none;background:none"></td>
      <td><button class="kill" data-del="${i.id}">×</button></td></tr>`).join('')}</tbody></table>
    <div class="add-row"><input id="new-item" placeholder="Add a source…"><button class="btn p" id="add-item">Add</button></div>`;
  }
  const rows=c.items.map(i=>`<div class="row ${i.status==='done'?'done':''}">
    <button class="check ${i.status==='done'?'on':''}" data-tog2="${i.id}"></button>
    <textarea class="txt" data-f="text" data-i="${i.id}" rows="1">${esc(i.text)}</textarea>
    <select data-f="owner" data-i="${i.id}" class="${i.owner?'has':''}">${owners.map(o=>`<option value="${esc(o)}" ${i.owner===o?'selected':''}>${o?esc(o):''}</option>`).join('')}</select>
    <input type="date" data-f="due" data-i="${i.id}" value="${i.due||''}">
    <button class="tiny up ${i.flag?'pink':'dim'}" data-flag="${i.id}" style="text-align:left">${i.flag?'★ Priority':'☆'}</button>
    <button class="kill" data-del="${i.id}">×</button></div>`).join('')||'<div class="empty">Nothing here yet.</div>';
  const links=`<div class="sec-label">Where things live</div><div class="links">
    ${(c.links||[]).map(l=>`<span class="link-pill"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a><button class="kill" data-dellink="${l.id}">×</button></span>`).join('')}
    <button class="link-pill" id="add-link" style="border-color:var(--pink);color:var(--pink)">+ Add link</button></div>`;
  const mt=S.meetings.filter(m=>m.cardId===c.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const meetings=`<div class="sec-label">Meetings</div>`+
    (mt.length?`<table><tbody>${mt.map(m=>`<tr><td class="tiny mono dim" style="width:96px">${fmtDate(m.date)}</td>
    <td>${esc(m.title)}${m.notes?`<div class="tiny dim">${esc(m.notes)}</div>`:''}</td>
    <td class="tiny pink up" style="width:120px">${esc(m.who||'')}</td>
    <td style="width:20px"><button class="kill" data-delmtg="${m.id}">×</button></td></tr>`).join('')}</tbody></table>`
    :'<div class="empty">No meetings logged.</div>')+
    `<div class="add-row"><button class="btn" id="add-mtg">+ Meeting</button></div>`;
  return head+`<div class="row-head"><span></span><span>Item</span><span class="hide">Owner</span><span class="hide">Due</span><span class="hide">Flag</span><span></span></div>
    <div class="rows">${rows}</div>
    <div class="add-row"><input id="new-item" placeholder="Add an item…"><button class="btn p" id="add-item">Add</button></div>`+links+meetings;
}

/* ================= WIRE ================= */
function wire(){
  document.querySelectorAll('[data-card]').forEach(el=>el.onclick=()=>{openCard=el.dataset.card;render();window.scrollTo(0,0);});
  document.querySelectorAll('[data-obj]').forEach(el=>el.onclick=()=>{activeObj=el.dataset.obj;view='objective';render();window.scrollTo(0,0);});
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const g=el.dataset.go;
    if(g==='messages'){S.dockOpen=true;save();renderDock();return;}
    view=g;openCard=null;activePerson=null;render();window.scrollTo(0,0);});
  const bh=$('#back-home'); if(bh) bh.onclick=goHome;
  document.querySelectorAll('[data-list]').forEach(b=>b.onclick=()=>{
    const [oid,cid]=b.getAttribute('data-list').split(':');
    S.openList||={}; S.openList[oid]=S.openList[oid]===cid?null:cid; save(); render();});
  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{
    const [oid,k]=b.getAttribute('data-sec').split(':');
    S.openSec||={}; S.openSec[oid]=S.openSec[oid]===k?null:k; save(); render();});
  document.querySelectorAll('[data-colitem]').forEach(li=>li.onclick=()=>{
    const [cid,iid]=li.getAttribute('data-colitem').split(':');
    const c=S.cards.find(x=>x.id===cid); if(!c)return;
    const it=c.items.find(i=>i.id===iid); if(!it)return;
    it.status=it.status==='done'?'todo':'done'; save(); render();});
  document.querySelectorAll('[data-axis]').forEach(g=>{
    g.addEventListener('click',e=>{
      e.stopPropagation(); clearTimeout(g.__t);
      const key=g.getAttribute('data-axis').split(':')[1];
      g.__t=setTimeout(()=>{ FOCUS_RAIL = FOCUS_RAIL===key ? null : key; OPEN_LINKS=null; render(); },230);
    });
  });
  document.querySelectorAll('[data-axis]').forEach(g=>g.addEventListener('dblclick',e=>{
    clearTimeout(g.__t);
    e.stopPropagation();
    const [cid,key]=g.getAttribute('data-axis').split(':');
    const c=S.cards.find(x=>x.id===cid); if(!c)return;
    const rail=(c.rails||[]).find(r=>r.key===key); if(!rail)return;
    const v=prompt('Name this line. Leave it empty to remove the line.',rail.name);
    if(v===null)return;
    if(!v.trim()){
      if(rail.spine){alert('The convergence line cannot be removed.');return;}
      const n=c.items.filter(i=>i.side===key).length;
      if(n&&!confirm(n+' step'+(n>1?'s':'')+' sit on this line. Remove the line and its steps?'))return;
      snap('line');
      c.items=c.items.filter(i=>i.side!==key);
      c.rails=c.rails.filter(r=>r.key!==key);
    } else rail.name=v.trim();
    save(); render();}));
  document.querySelectorAll('[data-solo]').forEach(g=>g.addEventListener('click',e=>{
    e.stopPropagation(); e.preventDefault();
    const [cid,id]=g.getAttribute('data-solo').split(':');
    const c=S.cards.find(x=>x.id===cid); if(!c)return;
    HIDDEN.add(id);
    OPEN_LINKS=null; SELS=new Set(); SEL=null; render();},true));
  document.querySelectorAll('[data-unhide]').forEach(g=>g.addEventListener('click',e=>{
    e.stopPropagation(); e.preventDefault();
    HIDDEN.delete(g.getAttribute('data-unhide').split(':')[1]); render();},true));
  const sa=$('#show-all'); if(sa) sa.onclick=()=>{HIDDEN=new Set();render();};
  const ra=$('#rail-all'); if(ra) ra.onclick=()=>{FOCUS_RAIL=null;render();};
  const bp=$('#board-pick');
  if(bp) bp.onchange=()=>{
    const id=bp.value; if(!id){render();return;}
    const c=S.cards.find(x=>x.group==='Flow'&&(x.boards||[]).some(b=>b.id===id));
    if(c && loadBoard(c,id)){ render(); flashMsg('Opened that board. Cmd Z to go back',2600); }
  };
  document.querySelectorAll('[data-boardsave]').forEach(b=>b.onclick=()=>{
    const c=S.cards.find(x=>x.id===b.getAttribute('data-boardsave')); if(!c)return;
    if(updateBoard(c)){ render(); flashMsg('Board saved',1600); return; }
    const n=prompt('Name this board','Deb'); if(!n)return;
    saveBoard(c,n.trim()); render(); flashMsg('Board saved',1600);});
  document.querySelectorAll('[data-boardnew]').forEach(b=>b.onclick=()=>{
    const c=S.cards.find(x=>x.id===b.getAttribute('data-boardnew')); if(!c)return;
    const n=prompt('Name this board','Deb'); if(!n)return;
    saveBoard(c,n.trim()); render(); flashMsg('Saved as a new board',1800);});
  document.querySelectorAll('[data-boarddel]').forEach(b=>b.onclick=()=>{
    const c=S.cards.find(x=>x.id===b.getAttribute('data-boarddel')); if(!c)return;
    const act=(c.boards||[]).find(x=>x.id===c.activeBoard); if(!act)return;
    if(!confirm('Delete the board "'+act.name+'"? What is on screen stays.'))return;
    snap('board'); c.boards=c.boards.filter(x=>x.id!==act.id); c.activeBoard=null;
    save(); render(); flashMsg('Board deleted. Cmd Z to undo',2200);});
  document.querySelectorAll('[data-newrail]').forEach(b=>b.onclick=()=>{
    const c=S.cards.find(x=>x.id===b.getAttribute('data-newrail')); if(!c)return;
    const name=prompt('Name the new line'); if(!name||!name.trim())return;
    const where=prompt('Put it on which side of Convergence? Type L or R','R');
    if(where===null)return;
    const key=uid();
    const spineAt=c.rails.findIndex(r=>r.spine);
    const at=/^l/i.test(where)?spineAt:spineAt+1;
    c.rails.splice(at,0,{key,name:name.trim()});
    save(); render();});
  let lblTimer=null;
  document.querySelectorAll('[data-flowown]').forEach(g=>{
    const get=()=>{const [cid,iid]=g.getAttribute('data-flowown').split(':');
      const c=S.cards.find(x=>x.id===cid); const it=c&&c.items.find(i=>i.id===iid); return {c,it};};
    g.addEventListener('click',e=>{
      e.stopPropagation();
      clearTimeout(lblTimer);
      lblTimer=setTimeout(()=>{const {c,it}=get(); if(it) nodeModal(c,it,()=>{save();render();});},240);
    });
    g.addEventListener('dblclick',e=>{
      e.stopPropagation(); e.preventDefault(); clearTimeout(lblTimer);
      const {c,it}=get(); if(it) inlineEditLabel(g,c,it);
    });
  });
  let chipDrag=null;
  document.querySelectorAll('[data-chip]').forEach(b=>{
    b.addEventListener('dragstart',e=>{chipDrag=b.getAttribute('data-chip');e.dataTransfer.effectAllowed='copy';
      try{e.dataTransfer.setData('text/plain',chipDrag||'clear');}catch(_){}} );
    b.addEventListener('click',()=>{chipDrag=chipDrag===b.getAttribute('data-chip')?null:b.getAttribute('data-chip');
      document.querySelectorAll('[data-chip]').forEach(x=>x.classList.remove('armed'));
      if(chipDrag!==null)b.classList.add('armed');});
  });
  const applyChip=(key,name)=>{
    const [cid,iid]=key.split(':');
    const c=S.cards.find(x=>x.id===cid); if(!c)return;
    const it=c.items.find(i=>i.id===iid); if(!it)return;
    if(name===''||name===null){it.owner='';}
    else{const cur=ownersOf(it.owner);
      const hit=cur.find(x=>x.toLowerCase()===name.toLowerCase());
      it.owner=(hit?cur.filter(x=>x!==hit):[...cur,name]).join(', ');}
    save();render();};
  document.querySelectorAll('[data-drop]').forEach(g=>{
    g.addEventListener('dragover',e=>{e.preventDefault();g.classList.add('dragover');});
    g.addEventListener('dragleave',()=>g.classList.remove('dragover'));
    g.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();g.classList.remove('dragover');
      const n=(e.dataTransfer&&e.dataTransfer.getData('text/plain'));
      applyChip(g.getAttribute('data-drop'), n==='clear'?'':n);});
    g.addEventListener('click',e=>{ if(chipDrag!==null){e.stopPropagation();applyChip(g.getAttribute('data-drop'),chipDrag);chipDrag=null;} },true);
  });
  wireFlowDrag();
  (function(){
    const svg=document.querySelector('.flowwrap svg'); if(!svg) return;
    const vb=svg.getAttribute('viewBox').split(' ').map(Number);
    const toSvg=e=>{const r=svg.getBoundingClientRect();
      return {x:(e.clientX-r.left)*vb[2]/r.width, y:(e.clientY-r.top)*vb[3]/r.height};};
    let pull=null, ghost=null;
    svg.querySelectorAll('[data-pull]').forEach(h=>{
      h.addEventListener('mousedown',e=>{
        e.preventDefault(); e.stopPropagation();
        const [cid,iid]=h.getAttribute('data-pull').split(':');
        const c=h.querySelector('circle');
        pull={cid,iid,x0:+c.getAttribute('cx'),y0:+c.getAttribute('cy')};
      });
    });
    window.addEventListener('mousemove',e=>{
      if(!pull) return;
      const p=toSvg(e);
      if(!ghost){ghost=document.createElementNS('http://www.w3.org/2000/svg','path');
        ghost.setAttribute('fill','none');ghost.setAttribute('stroke','#000');
        ghost.setAttribute('stroke-width','1');ghost.setAttribute('stroke-dasharray','4 4');svg.appendChild(ghost);}
      ghost.setAttribute('d',`M${pull.x0} ${pull.y0} L${p.x} ${p.y}`);
    });
    window.addEventListener('mouseup',e=>{
      if(!pull) return;
      if(ghost){ghost.remove();ghost=null;}
      const t=e.target.closest&&e.target.closest('g[data-flow]');
      if(t){
        const toId=t.getAttribute('data-flow').split(':')[1];
        const c=S.cards.find(x=>x.id===pull.cid);
        if(c&&toId!==pull.iid){
          c.conns=c.conns||[];
          if(!c.conns.some(cn=>cn.from===pull.iid&&cn.to===toId)){
            c.conns.push({id:uid(),from:pull.iid,to:toId});
            save(); pull=null; render(); return;
          }
        }
      }
      pull=null;
    });
    svg.querySelectorAll('[data-conn] .cx').forEach(x=>x.addEventListener('click',e=>{
      e.stopPropagation(); e.preventDefault();
      const g2=x.closest('[data-conn]');
      const [cid,connId]=g2.getAttribute('data-conn').split(':');
      const c=S.cards.find(y=>y.id===cid); if(!c)return;
      snap('line'); c.conns=(c.conns||[]).filter(cn=>cn.id!==connId); save(); render();
      flashMsg('Line removed. Cmd Z to undo',2000);},true));
  })();
  (function(){
    const svg=document.querySelector('.flowwrap svg'); if(!svg||!FLOW_GEO) return;
    const vb=svg.getAttribute('viewBox').split(' ').map(Number);
    svg.addEventListener('click',e=>{
      if(e.target.closest&&(e.target.closest('g[data-flow]')||e.target.closest('[data-axis]')||
         e.target.closest('.frailadd')||e.target.closest('[data-conn]'))) return;
      if(SELS.size||SEL||OPEN_LINKS){SELS=new Set();SEL=null;OPEN_LINKS=null;render();}
    });
    svg.addEventListener('contextmenu',e=>{
      e.preventDefault();
      const onNode=e.target.closest&&e.target.closest('g[data-flow]');
      if(onNode){
        const [cid,iid]=onNode.getAttribute('data-flow').split(':');
        const c0=S.cards.find(x=>x.id===cid); const it0=c0&&c0.items.find(i=>i.id===iid);
        if(it0){ SEL=iid; commentModal(c0,it0); }
        return;
      }
      const r=svg.getBoundingClientRect();
      const px=(e.clientX-r.left)*vb[2]/r.width, py=(e.clientY-r.top)*vb[3]/r.height;
      let rail=FLOW_GEO.rails[0];
      FLOW_GEO.rails.forEach(x=>{ if(Math.abs(x.x-px)<Math.abs(rail.x-px)) rail=x; });
      const c=S.cards.find(x=>x.id===FLOW_GEO.cardId); if(!c) return;
      const ni=P('New step','',{side:rail.key,y:Math.max(100,Math.round(py))});
      c.items.push(ni); EDIT_NEW=ni.id; SEL=ni.id; save(); render();
    });
  })();
  if(EDIT_NEW){
    const g=document.querySelector(`g[data-flowown$=":${EDIT_NEW}"]`);
    const cid=g&&g.getAttribute('data-flowown').split(':')[0];
    const c=cid&&S.cards.find(x=>x.id===cid);
    const it=c&&c.items.find(i=>i.id===EDIT_NEW);
    EDIT_NEW=null;
    if(g&&it) setTimeout(()=>inlineEditLabel(g,c,it),0);
  }
  (function(){
    const svg=document.querySelector('.flowwrap svg'); if(!svg) return;
    const vb=svg.getAttribute('viewBox').split(' ').map(Number);
    const toY=e=>{const r=svg.getBoundingClientRect();return (e.clientY-r.top)*vb[3]/r.height;};
    svg.querySelectorAll('.frailadd').forEach(g=>{
      let d=null,mv=false;
      g.addEventListener('mousedown',e=>{d={y0:e.clientY,key:g.getAttribute('data-addnode').split(':')[1],
        cid:g.getAttribute('data-addnode').split(':')[0]};mv=false;e.preventDefault();e.stopPropagation();});
      window.addEventListener('mousemove',e=>{
        if(!d)return;
        if(!mv&&Math.abs(e.clientY-d.y0)<5)return;
        mv=true; g.style.opacity='1';
        const c=svg.querySelector('.railghost')||(()=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');
          l.setAttribute('class','railghost');l.setAttribute('stroke','#000');l.setAttribute('stroke-width','1');
          l.setAttribute('stroke-dasharray','3 3');svg.appendChild(l);return l;})();
        const circ=g.querySelector('circle');
        c.setAttribute('x1',circ.getAttribute('cx'));c.setAttribute('x2',circ.getAttribute('cx'));
        c.setAttribute('y1',circ.getAttribute('cy'));c.setAttribute('y2',toY(e));
      });
      window.addEventListener('mouseup',e=>{
        if(!d)return;
        const gh=svg.querySelector('.railghost'); if(gh)gh.remove();
        if(mv){
          const c=S.cards.find(x=>x.id===d.cid);
          const rail=c&&(c.rails||[]).find(r=>r.key===d.key);
          if(rail){rail.len=Math.max(160,Math.round(toY(e))-40);save();render();}
        }
        d=null;mv=false;
      });
    });
  })();
  document.querySelectorAll('[data-addnode]').forEach(b=>b.onclick=e=>{
    if(b.dataset.suppress==='1'){b.dataset.suppress='';return;}
    const [cid,side]=b.getAttribute('data-addnode').split(':');
    const c=S.cards.find(x=>x.id===cid); if(!c)return;
    const c2=S.cards.find(x=>x.id===cid);
    const axisName=(c2&&c2.axes&&c2.axes[side])||'this line';
    const t=prompt('New topic on '+axisName); if(!t)return;
    c.items.push(P(t.trim(),'',{side}));
    save();render();});
  document.querySelectorAll('[data-lchip]').forEach(g=>g.addEventListener('click',e=>{
    e.stopPropagation(); e.preventDefault();
    const [cid,iid,fid]=g.getAttribute('data-lchip').split(':');
    const c=S.cards.find(x=>x.id===cid); const it=c&&c.items.find(i=>i.id===iid);
    if(!it) return;

function inlineEditLabel(g,card,it){
  const wrap=document.querySelector('.flowwrap'); if(!wrap) return;
  const old=wrap.querySelector('.inline-edit'); if(old) old.remove();
  const r=g.getBoundingClientRect(), w=wrap.getBoundingClientRect();
  const ta=document.createElement('textarea');
  ta.className='inline-edit';
  ta.value=it.text;
  const anchorEnd=(g.querySelector('text')||{}).getAttribute
    ? g.querySelector('text').getAttribute('text-anchor')==='end' : false;
  const width=Math.max(180,Math.min(360,r.width+40));
  ta.style.left=(anchorEnd ? r.right-w.left-width : r.left-w.left-6)+'px';
  ta.style.top=(r.top-w.top-6)+'px';
  ta.style.width=width+'px';
  ta.style.textAlign=anchorEnd?'right':'left';
  wrap.appendChild(ta);
  ta.focus(); ta.select();
  const commit=ok=>{
    if(ok){const v=ta.value.trim(); if(v){it.text=v; save();}}
    ta.remove(); render();
  };
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commit(true);}
    if(e.key==='Escape'){e.preventDefault();commit(false);}
  });
  ta.addEventListener('blur',()=>commit(true));
}
function wireFlowDrag(){
  const svg=document.querySelector('.flowwrap svg'); if(!svg) return;
  const vb=svg.getAttribute('viewBox').split(' ').map(Number);
  const GEO=FLOW_GEO||{rails:[]};
  const toSvg=e=>{const r=svg.getBoundingClientRect();
    return {x:(e.clientX-r.left)*vb[2]/r.width, y:(e.clientY-r.top)*vb[3]/r.height};};
  const railAt=x=>{let best=GEO.rails[0];
    GEO.rails.forEach(r=>{ if(Math.abs(r.x-x)<Math.abs(best.x-x)) best=r; }); return best;};
  const nodes=()=>[...svg.querySelectorAll('g[data-flow]')].map(g=>{
    const c=g.querySelector('circle'); const cx=c?+c.getAttribute('cx'):0, cy=c?+c.getAttribute('cy'):0;
    const r=railAt(cx);
    return {id:g.getAttribute('data-flow').split(':')[1], cx, cy, side:r?r.key:GEO.rails[0].key};
  });
  let drag=null, moved=false, ind=null;
  const clearInd=()=>{if(ind){ind.remove();ind=null;}};
  const showInd=(side,y)=>{
    clearInd();
    const rr=GEO.rails.find(r=>r.key===side)||GEO.rails[0];
    const x = rr?rr.x:0;
    ind=document.createElementNS('http://www.w3.org/2000/svg','line');
    ind.setAttribute('x1',x-70); ind.setAttribute('x2',x+70);
    ind.setAttribute('y1',y); ind.setAttribute('y2',y);
    ind.setAttribute('stroke','#000'); ind.setAttribute('stroke-width','3');
    svg.appendChild(ind);
  };
  const target=pt=>{
    const rail=railAt(pt.x)||GEO.rails[0];
    return {side:rail.key, y:Math.max(100,Math.round(pt.y))};
  };
  svg.querySelectorAll('g[data-flow]').forEach(g=>{
    g.addEventListener('mousedown',e=>{
      if(e.target.closest('.fclear')||e.target.closest('.fadd')||e.target.closest('.flink')) return;
      const [cid,iid]=g.getAttribute('data-flow').split(':');
      const c0=g.querySelector('circle');
      const r0=railAt(+c0.getAttribute('cx'));
      drag={cid,iid,x0:e.clientX,y0:e.clientY,startY:+c0.getAttribute('cy'),startSide:r0?r0.key:null}; moved=false;
      if(SELS.size>1&&SELS.has(iid)) svg.querySelectorAll('g[data-flow]').forEach(g2=>{
        if(SELS.has(g2.getAttribute('data-flow').split(':')[1])) g2.style.opacity='.45';});
      else g.style.opacity='.45';
      e.preventDefault();
    });
  });
  const onMove=e=>{
    if(!drag) return;
    if(!moved && Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<5) return;
    moved=true;
    const t=target(toSvg(e)); showInd(t.side,t.y);
  };
  const onUp=e=>{
    if(!drag) return;
    svg.querySelectorAll('g[data-flow]').forEach(g2=>g2.style.opacity='');
    clearInd();
    if(!moved){drag=null;return;}
    const t=target(toSvg(e));
    const c=S.cards.find(x=>x.id===drag.cid);
    if(c){
      const it=c.items.find(i=>i.id===drag.iid);
      if(it){
        const startY=drag.startY!=null?drag.startY:t.y;
        const dy=t.y-startY;
        const railChanged=t.side!==drag.startSide;
        if(SELS.size>1&&SELS.has(drag.iid)){
          const cur=new Map();
          svg.querySelectorAll('g[data-flow]').forEach(g2=>{
            const cc=g2.querySelector('circle');
            if(cc) cur.set(g2.getAttribute('data-flow').split(':')[1],+cc.getAttribute('cy'));
          });
          c.items.forEach(x=>{ if(SELS.has(x.id)){
            const base=(typeof x.y==='number')?x.y:(cur.get(x.id)||t.y);
            x.y=Math.max(100,Math.round(base+dy));
            if(railChanged) x.side=t.side;
          }});
        } else {
          it.side=t.side; it.y=t.y;
        }
        const known=new Map();
        svg.querySelectorAll('g[data-flow]').forEach(g2=>{
          const cc=g2.querySelector('circle');
          if(cc) known.set(g2.getAttribute('data-flow').split(':')[1],+cc.getAttribute('cy'));
        });
        known.set(it.id,t.y);
        const idxs=[]; c.items.forEach((x,i)=>{ if(x.side===t.side) idxs.push(i); });
        const sorted=idxs.map(i=>c.items[i]).sort((a,b)=>
          ((typeof a.y==='number')?a.y:(known.get(a.id)??1e9)) - ((typeof b.y==='number')?b.y:(known.get(b.id)??1e9)));
        idxs.forEach((i,k)=>{ c.items[i]=sorted[k]; });
        save();
      }
    }
    drag=null; moved=false; render();
  };
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  svg.addEventListener('click',e=>{ if(moved){e.stopPropagation();e.preventDefault();} },true);
}

}
function relTime(ts){
  const d=new Date(ts), t=todayISO(), k=new Date(ts).toISOString().slice(0,10);
  if(k===t) return fmtTime(ts);
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(k===y) return 'Yesterday';
  return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'});
}

function renderDock(){
  const panel=$('#dock-panel');
  const un=totalUnread(), badge=$('#dock-badge');
  badge.textContent=un; badge.hidden=!un;
  panel.hidden=!S.dockOpen;
  $('#dock-pill').style.display=S.dockOpen?'none':'flex';
  if(!S.dockOpen) return;
  const t=S.dockThread?thread(S.dockThread):null;
  if(S.dockThread&&!t){S.dockThread=null;}
  t?renderThread(thread(S.dockThread)):renderThreadList();
}

function renderThreadList(){
  $('#dock-foot').hidden=true; $('#dock-hint').hidden=true; $('#im-search').hidden=false;
  $('#im-head').innerHTML=`<span class="ttl">Messages</span>
    <span class="sub">as</span><select class="who-sel" id="im-as">${names().map(n=>`<option ${S.me===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
    <button id="im-new" title="New message">✎</button><button id="im-close">×</button>`;
  const rows=[...S.threads].map(t=>{
    const ms=threadMsgs(t.id), last=ms[ms.length-1], un=threadUnread(t);
    if(imQ){const s=imQ.toLowerCase();
      if(!(threadName(t).toLowerCase().includes(s)||ms.some(m=>m.text.toLowerCase().includes(s)))) return '';}
    return {t,last,un,sort:last?last.ts:0};
  }).filter(Boolean).sort((a,b)=>b.sort-a.sort);
  $('#im-body').innerHTML=`<div class="im-list">`+(rows.length?rows.map(({t,last,un})=>`
    <button class="trow ${un?'unread':''}" data-thread="${t.id}">
      ${avatarHTML(t)}
      <span style="overflow:hidden">
        <span class="tname">${esc(threadName(t))}</span>
        <span class="tprev">${last?esc((last.author===S.me?'You: ':(t.dm?'':last.author+': '))+last.text).slice(0,60):'No messages yet'}</span>
      </span>
      <span class="tright">${last?`<span class="ttime">${relTime(last.ts)}</span>`:''}${un?'<span class="tdot"></span>':''}</span>
    </button>`).join(''):`<div class="im-empty">No conversations match.</div>`)+`</div>`;

  $('#im-as').onchange=e=>{S.me=e.target.value;save();renderDock();};
  $('#im-close').onclick=closeDock;
  $('#im-new').onclick=newThreadModal;
  $('#im-body').querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>openThread(b.dataset.thread));
}

function renderThread(t){
  $('#dock-foot').hidden=false; $('#dock-hint').hidden=false; $('#im-search').hidden=true;
  const who=t.dm?threadName(t):t.members.join(', ');
  $('#im-head').innerHTML=`<button class="im-back" id="im-back">‹</button>
    ${avatarHTML(t)}
    <span class="ttl" style="line-height:1.2">${esc(threadName(t))}
      <span class="sub" style="display:block">${esc(t.dm?'Direct':who)}</span></span>
    <button id="im-pdf" title="Save this thread today as PDF">PDF</button>
    <button id="im-info" title="Thread settings">···</button>
    <button id="im-close">×</button>`;

  const ms=threadMsgs(t.id).slice(-200);
  let lastDay=null, html='';
  ms.forEach((m,i)=>{
    const d=dayKey(m);
    if(d!==lastDay){html+=`<div class="daydiv">${d===todayISO()?'Today':fmtDay(d)}</div>`;lastDay=d;}
    if(m.kind==='note'){html+=`<div class="bwrap sys" data-msg="${m.id}"><div class="b">${fmtMsg(m.text)}</div></div>`;return;}
    const mine=m.author===S.me;
    const next=ms[i+1];
    const tail=!next||next.author!==m.author||next.kind==='note'||dayKey(next)!==d;
    const prev=ms[i-1];
    const showName=!mine&&!t.dm&&(!prev||prev.author!==m.author||prev.kind==='note'||dayKey(prev)!==d);
    const r=m.reactions||{};
    const tb=Object.keys(r).filter(k=>r[k]&&r[k].length);
    html+=`<div class="bwrap ${mine?'me':'them'} ${tail?'tail gapafter':''}" data-msg="${m.id}">
      ${showName?`<div class="bname">${esc(m.author)}</div>`:''}
      ${tb.length?`<span class="tapbacks">${tb.map(k=>`<span class="tapback ${r[k].includes(S.me)?'mine':''}">${k}${r[k].length>1?`<b>${r[k].length}</b>`:''}</span>`).join('')}</span>`:''}
      <div class="b" data-bub="${m.id}" title="${esc(m.author)} · ${fmtTime(m.ts)}">${fmtMsg(m.text)}</div>
    </div>`;
    if(tail&&mine&&i===ms.length-1) html+=`<div class="receipt">Delivered</div>`;
  });
  $('#im-body').innerHTML=`<div class="im-thread">${html||'<div class="im-empty">Start the conversation.</div>'}</div>`;
  const body=$('#im-body'); body.scrollTop=body.scrollHeight;

  (S.lastRead||={})[t.id]=Date.now(); save();

  $('#im-back').onclick=()=>{S.dockThread=null;tbOpen=null;save();renderDock();};
  $('#im-close').onclick=closeDock;
  $('#im-pdf').onclick=()=>printThreadDay(t.id,todayISO());
  $('#im-info').onclick=()=>threadInfoModal(t.id);
  $('#dock-in').placeholder=t.dm?`Message ${threadName(t)}`:'Message';

  body.querySelectorAll('[data-bub]').forEach(el=>{
    el.onclick=e=>{e.stopPropagation();openTapbacks(el.dataset.bub);};
  });
  if(tbOpen){
    const wrap=body.querySelector(`.bwrap[data-msg="${tbOpen}"]`);
    if(wrap){
      const pop=document.createElement('div');pop.className='tb-pop';
      pop.innerHTML=TAPBACKS.map(k=>`<button data-tb="${k}">${k}</button>`).join('')+
        `<span class="sep"></span><button class="txtbtn" data-tbtask="1">Task</button><button class="txtbtn" data-tbdel="1">Del</button>`;
      wrap.appendChild(pop);
      pop.querySelectorAll('[data-tb]').forEach(b=>b.onclick=e=>{e.stopPropagation();react(tbOpen,b.dataset.tb);});
      pop.querySelector('[data-tbtask]').onclick=e=>{e.stopPropagation();const id=tbOpen;tbOpen=null;taskFromMsg(id);};
      pop.querySelector('[data-tbdel]').onclick=e=>{e.stopPropagation();
        S.log=S.log.filter(l=>l.id!==tbOpen);tbOpen=null;save();renderDock();
        if(view==='log'&&!openCard&&!activePerson)render();};
    }
  }
}
function openTapbacks(id){ tbOpen = tbOpen===id?null:id; renderDock(); }
function react(msgId,key){
  const m=S.log.find(l=>l.id===msgId); if(!m) return;
  m.reactions||={}; m.reactions[key]||=[];
  const i=m.reactions[key].indexOf(S.me);
  if(i>-1) m.reactions[key].splice(i,1); else m.reactions[key].push(S.me);
  if(!m.reactions[key].length) delete m.reactions[key];
  tbOpen=null; save(); renderDock();
}
function taskFromMsg(id){
  const m=S.log.find(l=>l.id===id); if(!m) return;
  const titles=S.cards.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('');
  showModal(`<h3>Turn into a task</h3>
    <div class="f"><label>Task</label><input id="mt-text" value="${esc(m.text)}"></div>
    <div class="f"><label>Card</label><select id="mt-card">${titles}</select></div>
    <div class="f"><label>Owner</label><select id="mt-owner"><option value=""></option>${names().map(n=>`<option ${n===m.author?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
    <div class="f"><label>Due</label><input type="date" id="mt-due"></div>
    <div class="modal-acts"><button class="btn" id="mt-cancel">Cancel</button><button class="btn p" id="mt-save">Add</button></div>`,s=>{
    s.querySelector('#mt-cancel').onclick=()=>{closeModal();renderDock();};
    s.querySelector('#mt-save').onclick=()=>{
      const c=S.cards.find(x=>x.id===s.querySelector('#mt-card').value);
      c.items.push(P(s.querySelector('#mt-text').value.trim(),s.querySelector('#mt-owner').value,
        {due:s.querySelector('#mt-due').value,flag:true}));
      save();closeModal();render();};
  });
}
function openThread(id){S.dockThread=id;tbOpen=null;save();renderDock();setTimeout(()=>$('#dock-in').focus(),30);}
function closeDock(){S.dockOpen=false;tbOpen=null;save();renderDock();}

function newThreadModal(){
  showModal(`<h3>New message</h3>
    <div class="f"><label>To</label><div class="member-list" id="nt-members">
      ${names().filter(n=>n!==S.me).map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>
    <div class="f"><label>Group name (optional)</label><input id="nt-name" placeholder="Leave blank for a direct message"></div>
    <div class="modal-acts"><button class="btn" id="nt-cancel">Cancel</button><button class="btn p" id="nt-save">Start</button></div>`,s=>{
    const picked=new Set();
    s.querySelectorAll('#nt-members button').forEach(b=>b.onclick=()=>{
      const n=b.dataset.n; picked.has(n)?picked.delete(n):picked.add(n); b.classList.toggle('on');});
    s.querySelector('#nt-cancel').onclick=closeModal;
    s.querySelector('#nt-save').onclick=()=>{
      const mem=[...picked]; if(!mem.length){alert('Pick at least one person.');return;}
      const nm=s.querySelector('#nt-name').value.trim();

        const ex=S.threads.find(t=>t.dm&&t.members.includes(mem[0])&&t.members.includes(S.me));
        if(ex){closeModal();openThread(ex.id);return;}
        S.threads.push({id:uid(),dm:true,name:mem[0],members:[S.me,mem[0]]});
      } else {
        S.threads.push({id:uid(),dm:false,name:nm||mem.join(' & '),members:[S.me,...mem]});
      }
      const t=S.threads[S.threads.length-1]; save(); closeModal(); openThread(t.id);};

function threadText(id){
  const t=thread(id), ms=threadMsgs(id);
  return `radish · ${threadName(t).toUpperCase()}\n${t.members.join(', ')}\n\n`+
    ms.map(m=>`[${new Date(m.ts).toLocaleString('en-US')}] ${m.author}: ${m.text}`).join('\n')+'\n';
}
function printThreadDay(id,d){
  const t=thread(id);
  const ms=threadMsgs(id).filter(m=>dayKey(m)===d);
  $('#printroot').innerHTML=`<div class="p-head"><div class="p-title">radish · ${esc(threadName(t))}</div>
    <div style="font-size:9px;letter-spacing:.12em;margin-top:4px">${fmtDay(d)} · ${esc(t.members.join(', '))}</div></div>`+
    (ms.map(m=>`<div class="p-msg"><div class="p-who">${esc(m.author)} · ${fmtTime(m.ts)}</div><div class="p-body">${esc(m.text)}</div></div>`).join('')
      ||'<div class="p-body">No messages today.</div>');
  window.print();
  setTimeout(()=>{$('#printroot').innerHTML='';},800);

function initDock(){
  const inp=$('#dock-in');
  const grow=()=>{inp.style.height='auto';inp.style.height=Math.min(110,inp.scrollHeight)+'px';};
  const send=()=>{
    const v=inp.value; if(!v.trim())return;
    postLog(v,S.me,S.dockThread||'t-main'); inp.value=''; grow(); renderDock();
    if((view==='log'||view==='board')&&!openCard&&!activePerson) render();
  };
  inp.oninput=grow;
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
  $('#dock-send').onclick=send;
  $('#dock-pill').onclick=()=>{S.dockOpen=true;save();renderDock();};
  $('#im-q').oninput=e=>{imQ=e.target.value;const p=e.target.selectionStart;renderDock();
    const n=$('#im-q');if(n){n.focus();n.setSelectionRange(p,p);}};
  document.addEventListener('click',e=>{
    if(tbOpen&&!e.target.closest('.tb-pop')&&!e.target.closest('[data-bub]')){tbOpen=null;renderDock();}
  });
}

function showModal(html,onMount){
  closeModal();
  const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="modal">${html}</div>`;
  s.addEventListener('click',e=>{if(e.target===s)closeModal();});
  document.body.appendChild(s);modal=s;document.addEventListener('keydown',escClose);

}

function closeModal(){if(modal){modal.remove();modal=null;document.removeEventListener('keydown',escClose);}}
