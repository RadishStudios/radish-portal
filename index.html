function restoreModal(fresh){
  const keys=bakList();
  const rows=keys.map(k=>{
    let info={};
    try{ const d=JSON.parse(localStorage.getItem(k)); const st=d.state||{};
      info={when:new Date(d.at||0), cards:(st.cards||[]).length,
        items:(st.cards||[]).reduce((a,c)=>a+((c.items||[]).length),0),
        msgs:(st.log||[]).length}; }catch(e){ info=null; }
    if(!info) return '';
    return `<div class="bakrow">
      <div><b>${info.when.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</b>
        <div class="tiny dim">${info.cards} cards, ${info.items} items, ${info.msgs} messages</div></div>
      <button class="btn sm" data-restore="${k}">Restore</button></div>`;
  }).join('')||'<div class="empty" style="padding:10px 0">No backups on this copy of the file yet.</div>';
  showModal(`<h3>${fresh?'This copy is empty':'Restore'}</h3>
    ${fresh?`<div class="f" style="font-size:11px;line-height:1.5;color:var(--dim)">
      This looks like a freshly downloaded file, so it starts blank. Your work lives with the copy you were using before.
      Open that one, press Export, then Import the file here.</div>`:''}
    <div class="f"><label>Backups saved on this file</label><div class="baks">${rows}</div></div>
    <div class="modal-acts"><button class="btn" id="rs-import">Import a file</button>
      <button class="btn p" id="rs-close">Close</button></div>`, sc=>{
    sc.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{
      if(!confirm('Replace what is here with this backup?'))return;
      try{ const d=JSON.parse(localStorage.getItem(b.getAttribute('data-restore')));
        snap('restore'); S=d.state; save(); closeModal(); openCard=null; activePerson=null; render();
        flashMsg('Restored. Cmd Z to undo',2600);
      }catch(e){ alert('That backup could not be read.'); }
    });
    sc.querySelector('#rs-import').onclick=()=>{closeModal();$('#file-in').click();};
    sc.querySelector('#rs-close').onclick=closeModal;
  });
}
function objectiveModal(id){

    <div class="f"><label>Objective</label><input id="ob-t" value="${esc(o.title)}" placeholder="What are we actually doing"></div>
    <div class="f"><label>One line of why</label><input id="ob-n" value="${esc(o.note||'')}"></div>
    <div class="f"><label>Outcomes (one per line)</label><textarea id="ob-o" style="min-height:80px">${esc((o.outcomes||[]).join('\n'))}</textarea></div>
    <div class="f"><label>The Funnel. One per line, Phase | chain, using \u2192 and =</label><textarea id="ob-f" style="min-height:150px">${esc(normFunnel(o).map(f=>(f.phase?f.phase+' | ':'')+f.text).join('\n'))}</textarea></div>
    <div class="f"><label>The goal (one per line)</label><textarea id="ob-g" style="min-height:110px">${esc(normGoals(o).map(g=>(g.p?g.p+' ':'')+g.text).join('\n'))}</textarea></div>

      ${S.cards.map(c=>`<button data-c="${c.id}" class="${(o.cards||[]).includes(c.id)?'on':''}">${esc(c.title)}</button>`).join('')}</div></div>

      const c=b.dataset.c; picked.has(c)?picked.delete(c):picked.add(c); b.classList.toggle('on');});

    const d=s.querySelector('#ob-del');
    if(d)d.onclick=()=>{if(confirm('Delete this objective? The cards underneath stay.')){snap('objective');
      S.objectives=S.objectives.filter(x=>x.id!==id);closeModal();goHome();}};
    s.querySelector('#ob-save').onclick=()=>{
      const t=s.querySelector('#ob-t').value.trim(); if(!t){alert('Give it a title.');return;}
      const payload={title:t,note:s.querySelector('#ob-n').value.trim(),cards:[...picked],
        outcomes:s.querySelector('#ob-o').value.split('\n').map(x=>x.trim()).filter(Boolean),
        funnel:s.querySelector('#ob-f').value.split('\n').map(x=>x.trim()).filter(Boolean)
          .map(x=>{const m=x.match(/^([A-Za-z ]{2,12})\s*\|\s*(.*)$/);
            return m?{phase:m[1].trim(),text:m[2]}:{phase:'',text:x};}),
        goals:s.querySelector('#ob-g').value.split('\n').map(x=>x.trim()).filter(Boolean)
          .map(x=>{const m=x.match(/^(P[1-9])\s+(.*)$/i);return m?{p:m[1].toUpperCase(),text:m[2]}:{p:'',text:x};})};
      if(id) Object.assign(S.objectives.find(x=>x.id===id),payload);
      else S.objectives.push({id:uid(),...payload});
      save();closeModal();render();};
  });
}

document.addEventListener('keydown',e=>{
  if((e.key==='Delete'||e.key==='Backspace')&&SELS.size&&!modal
     &&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
    const c=S.cards.find(x=>x.group==='Flow'&&x.items.some(i=>SELS.has(i.id)));
    if(c){
      snap(SELS.size>1?'steps':'step');
      const n=SELS.size;
      c.items=c.items.filter(i=>!SELS.has(i.id));
      SELS=new Set(); SEL=null; save(); render();
      flashMsg(n+(n>1?' deleted':' deleted')+'. Cmd Z to undo',2400);
      e.preventDefault(); return;
    }
  }
  if((e.key==='z'||e.key==='Z')&&(e.metaKey||e.ctrlKey)
     &&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    e.preventDefault();
    const what=undoLast();
    flashMsg(what?('Undid the '+what):'Nothing left to undo',1800);
    return;
  }
  if(e.key==='Escape'&&!modal&&(SELS.size||SEL||OPEN_LINKS||HIDDEN.size)){
    SELS=new Set();SEL=null;OPEN_LINKS=null;HIDDEN=new Set();render();return;}
  if(e.key==='Escape'&&!modal){ if(openCard||activePerson){openCard=null;activePerson=null;render();} else if(view!=='home'){goHome();} }
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
    e.preventDefault();const qi=$('#q');if(qi)qi.focus();}
});

document.addEventListener('drop',e=>{if(view!=='grid')e.preventDefault();});
